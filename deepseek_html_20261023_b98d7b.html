<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أصداء المطلق — Echoes of the Absolute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* ============================================
   RESET & TOKENS
   ============================================ */
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
}

:root {
  --void: #000000;
  --charcoal: #0A0A0F;
  --gold: #C9A961;
  --gold-light: #E8D5A0;
  --gold-warm: #F5E6C8;
  --blue: #4A90D9;
  --purple: #6A4A8A;
  --bone: #E8E4DC;
  
  --font-ar: 'Amiri', serif;
  --font-en: 'Cormorant Garamond', serif;
  --font-ui: 'Inter', sans-serif;
  
  --ease-cinematic: cubic-bezier(0.65, 0, 0.35, 1);
}

html { scroll-behavior: smooth; }

body {
  background: var(--void);
  color: var(--bone);
  font-family: var(--font-ar);
  overflow-x: hidden;
  min-height: 100vh;
  transition: font-family 0.5s;
}

body[data-mode="englishPrimary"] { font-family: var(--font-en); }

/* ============================================
   PORTAL
   ============================================ */
.portal {
  position: fixed;
  inset: 0;
  background: var(--void);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 2s var(--ease-cinematic);
}

.portal::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(201,169,97,0.04) 0%, transparent 60%);
  animation: portalGlow 4s ease-in-out infinite;
}

@keyframes portalGlow {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

.portal__content {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4rem;
  z-index: 2;
  opacity: 0;
  animation: portalFadeIn 3s var(--ease-cinematic) 0.5s forwards;
}

@keyframes portalFadeIn { to { opacity: 1; } }

.portal__line {
  font-size: clamp(1.1rem, 2.2vw, 1.5rem);
  font-weight: 400;
  letter-spacing: 0.05em;
  color: rgba(232, 228, 220, 0.4);
  font-style: italic;
  animation: whisperPulse 6s ease-in-out infinite;
}

.portal__line--bottom { animation-delay: 2s; }

@keyframes whisperPulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.7; }
}

.portal__awaken {
  position: relative;
  width: 140px;
  height: 140px;
  background: transparent;
  border: none;
  cursor: pointer;
}

.portal__circle {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid rgba(201, 169, 97, 0.3);
  background: radial-gradient(circle, rgba(201, 169, 97, 0.05) 0%, transparent 70%);
  animation: heartbeat 2s ease-in-out infinite;
  box-shadow: 0 0 20px rgba(201, 169, 97, 0.15), inset 0 0 20px rgba(201, 169, 97, 0.05);
}

.portal__circle::before,
.portal__circle::after {
  content: '';
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 1px solid rgba(201, 169, 97, 0.1);
  animation: ripple 3s ease-out infinite;
}

.portal__circle::after { animation-delay: 1.5s; }

@keyframes heartbeat {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.1); opacity: 1; }
}

@keyframes ripple {
  0% { transform: scale(1); opacity: 0.6; }
  100% { transform: scale(1.5); opacity: 0; }
}

.portal__text {
  font-family: var(--font-ui);
  font-size: 0.7rem;
  letter-spacing: 0.5em;
  color: var(--gold);
  opacity: 0;
  transition: all 0.6s var(--ease-cinematic);
  position: absolute;
  bottom: -55px;
  left: 50%;
  transform: translate(-50%, 8px);
}

.portal__awaken:hover .portal__circle {
  transform: scale(1.15);
  border-color: rgba(201, 169, 97, 0.8);
  box-shadow: 0 0 50px rgba(201, 169, 97, 0.5);
}

.portal__awaken:hover .portal__text {
  opacity: 1;
  transform: translate(-50%, 0);
}

.portal--awakening {
  animation: portalBurst 2.5s var(--ease-cinematic) forwards;
  pointer-events: none;
}

@keyframes portalBurst {
  0% { background: #000; transform: scale(1); opacity: 1; }
  40% { background: #C9A961; transform: scale(1.05); opacity: 1; }
  70% { background: #E8D5A0; transform: scale(1.5); opacity: 0.8; }
  100% { background: #000; transform: scale(12); opacity: 0; }
}

/* ============================================
   EXPERIENCE BASE
   ============================================ */
.experience {
  opacity: 0;
  transition: opacity 2s var(--ease-cinematic);
}

.experience--visible { opacity: 1; }

/* Progress Bar */
.progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  height: 2px;
  width: 0%;
  background: linear-gradient(90deg, var(--gold), var(--gold-light));
  box-shadow: 0 0 10px var(--gold);
  z-index: 1000;
  transition: width 0.2s linear;
}

/* Controls */
.controls {
  position: fixed;
  top: 2rem;
  left: 2rem;
  display: flex;
  gap: 0.75rem;
  z-index: 1000;
  opacity: 0;
  animation: controlsIn 1s 4s forwards;
}

@keyframes controlsIn { to { opacity: 0.8; } }

.controls button {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(10, 10, 15, 0.6);
  border: 1px solid rgba(201, 169, 97, 0.2);
  backdrop-filter: blur(20px);
  color: var(--gold);
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.3s var(--ease-cinematic);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-ui);
}

.controls button:hover {
  border-color: rgba(201, 169, 97, 0.6);
  box-shadow: 0 0 20px rgba(201, 169, 97, 0.3);
  transform: scale(1.1);
}

/* Mode Selector */
.mode-selector {
  position: fixed;
  top: 2rem;
  right: 2rem;
  display: flex;
  gap: 0.4rem;
  padding: 0.4rem;
  background: rgba(10, 10, 15, 0.6);
  border: 1px solid rgba(201, 169, 97, 0.2);
  border-radius: 30px;
  backdrop-filter: blur(20px);
  z-index: 1000;
  opacity: 0;
  animation: controlsIn 1s 4s forwards;
}

.mode-selector button {
  padding: 0.4rem 0.9rem;
  border-radius: 20px;
  background: transparent;
  border: none;
  color: rgba(232, 228, 220, 0.5);
  font-family: var(--font-ui);
  font-size: 0.75rem;
  cursor: pointer;
  transition: all 0.3s;
}

.mode-selector button.active {
  background: rgba(201, 169, 97, 0.2);
  color: var(--gold);
}

/* ============================================
   ACTS
   ============================================ */
.act {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 4rem 2rem;
}

.act canvas.bg-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

.act__overlay {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

.act__content {
  position: relative;
  z-index: 2;
  max-width: 900px;
  width: 100%;
  text-align: center;
  padding: 2rem;
}

/* ============================================
   POEM — Arabic Primary
   ============================================ */
.poem {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.poem__line {
  transition: all 1s var(--ease-cinematic);
  cursor: pointer;
  padding: 0.5rem;
  filter: blur(5px);
  opacity: 0.25;
  transform: scale(0.94);
}

.poem__line--active {
  filter: blur(0);
  opacity: 1;
  transform: scale(1);
  text-shadow: 0 0 25px rgba(201, 169, 97, 0.35), 0 0 50px rgba(201, 169, 97, 0.15);
}

.poem__primary {
  font-family: var(--font-ar);
  font-size: clamp(1.4rem, 3vw, 2.3rem);
  line-height: 1.6;
  font-weight: 400;
  color: var(--bone);
  display: block;
}

body[data-mode="englishPrimary"] .poem__primary {
  font-family: var(--font-en);
  font-style: italic;
  font-weight: 300;
}

.poem__secondary {
  font-family: var(--font-en);
  font-size: clamp(0.85rem, 1.4vw, 1.05rem);
  font-style: italic;
  font-weight: 300;
  color: rgba(232, 228, 220, 0.4);
  margin-top: 0.5rem;
  display: block;
  transition: opacity 0.5s;
}

body[data-mode="englishPrimary"] .poem__secondary {
  font-family: var(--font-ar);
  font-style: normal;
}

body[data-mode="arabicOnly"] .poem__secondary,
body[data-mode="englishOnly"] .poem__secondary {
  display: none;
}

.poem__line--active .poem__secondary {
  color: rgba(232, 228, 220, 0.6);
}

/* ============================================
   ACT-SPECIFIC THEMES
   ============================================ */
.act--1 { background: radial-gradient(ellipse at center, #1C1C28 0%, #0A0A0F 60%, #000 100%); }
.act--1 .act__overlay { background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.8) 100%); }

.act--2 { background: #000; }
.act--2 .act__overlay {
  background: linear-gradient(90deg,
    rgba(92, 42, 58, 0.25) 0%,
    rgba(0,0,0,0.9) 45%,
    rgba(0,0,0,0.9) 55%,
    rgba(42, 58, 92, 0.25) 100%);
}

.act--2 .split-glow {
  position: absolute;
  top: 50%;
  width: 40%;
  height: 60%;
  transform: translateY(-50%);
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.4;
  animation: glowBreathe 6s ease-in-out infinite;
  z-index: 1;
}

.act--2 .split-glow--left { left: -10%; background: #5C2A3A; }
.act--2 .split-glow--right { right: -10%; background: #2A3A5C; animation-delay: 2s; }

@keyframes glowBreathe {
  0%, 100% { opacity: 0.3; transform: translateY(-50%) scale(1); }
  50% { opacity: 0.6; transform: translateY(-50%) scale(1.15); }
}

.bridge { background: #000; }

.bridge__beam {
  position: absolute;
  top: 0;
  left: 50%;
  width: 3px;
  height: 100%;
  background: linear-gradient(180deg, transparent 0%, var(--gold) 20%, var(--gold-light) 50%, var(--gold) 80%, transparent 100%);
  box-shadow: 0 0 60px var(--gold), 0 0 120px rgba(201, 169, 97, 0.5);
  transform: translateX(-50%);
  z-index: 1;
  animation: beamPulse 3s ease-in-out infinite;
}

@keyframes beamPulse {
  0%, 100% { opacity: 0.7; width: 3px; }
  50% { opacity: 1; width: 5px; }
}

.bridge .poem__line--active { color: var(--gold-light); }
.bridge .poem__line--active .poem__primary { color: var(--gold-light); }

.act--4 { background: radial-gradient(ellipse at top, rgba(74, 144, 217, 0.15) 0%, #0A1A2A 40%, #000 100%); }
.act--4 .poem__line--active .poem__primary {
  color: var(--blue);
  text-shadow: 0 0 25px rgba(74, 144, 217, 0.6), 0 0 50px rgba(74, 144, 217, 0.3);
}

.notifications { position: absolute; inset: 0; pointer-events: none; z-index: 1; }

.notif {
  position: absolute;
  font-size: 1.8rem;
  opacity: 0;
  filter: blur(2px);
  animation: notifFloat 5s ease-in-out infinite;
}

.notif:nth-child(1) { top: 15%; left: 8%; animation-delay: 0s; }
.notif:nth-child(2) { top: 22%; right: 10%; animation-delay: 1s; }
.notif:nth-child(3) { top: 65%; left: 6%; animation-delay: 2s; }
.notif:nth-child(4) { bottom: 18%; right: 8%; animation-delay: 3s; }
.notif:nth-child(5) { top: 45%; right: 18%; animation-delay: 4s; }

@keyframes notifFloat {
  0% { opacity: 0; transform: translateY(0) scale(0.7); }
  20% { opacity: 0.7; transform: translateY(-15px) scale(1); }
  80% { opacity: 0.4; transform: translateY(-40px) scale(1); }
  100% { opacity: 0; transform: translateY(-70px) scale(0.7); }
}

.act--3 { background: #000; }
.act--3 .act__overlay { background: radial-gradient(ellipse at center, rgba(138, 74, 90, 0.15) 0%, #000 70%); }
.act--3 .poem__line--active .poem__primary {
  color: #AA5A6A;
  text-shadow: 0 0 25px rgba(138, 74, 90, 0.6), 0 0 50px rgba(138, 74, 90, 0.3);
}

.mirror-shards {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}

.shard {
  position: absolute;
  width: 2px;
  height: 60%;
  background: linear-gradient(180deg, transparent 0%, rgba(232, 228, 220, 0.15) 50%, transparent 100%);
  transform-origin: center;
  animation: shardShift 8s ease-in-out infinite;
}

.shard:nth-child(1) { left: 15%; top: 20%; transform: rotate(15deg); animation-delay: 0s; }
.shard:nth-child(2) { left: 30%; top: 10%; transform: rotate(-8deg); animation-delay: 1s; height: 70%; }
.shard:nth-child(3) { left: 55%; top: 15%; transform: rotate(22deg); animation-delay: 2s; }
.shard:nth-child(4) { left: 70%; top: 20%; transform: rotate(-15deg); animation-delay: 3s; height: 65%; }
.shard:nth-child(5) { left: 85%; top: 25%; transform: rotate(10deg); animation-delay: 4s; }

@keyframes shardShift {
  0%, 100% { opacity: 0.2; transform: rotate(var(--rotate, 0deg)) translateY(0); }
  50% { opacity: 0.6; transform: rotate(var(--rotate, 0deg)) translateY(-20px); }
}

.bridge--2 { background: #000; }
.bridge--2 .act__overlay { background: radial-gradient(ellipse at bottom, rgba(106, 74, 138, 0.2) 0%, #000 70%); }
.bridge--2 .poem__line--active .poem__primary {
  color: #9A7ABA;
  text-shadow: 0 0 30px rgba(106, 74, 138, 0.6), 0 0 60px rgba(106, 74, 138, 0.3);
}

.water-waves {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 40%;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}

.wave {
  position: absolute;
  bottom: 0;
  left: -10%;
  width: 120%;
  height: 100%;
  background: linear-gradient(180deg, transparent 0%, rgba(106, 74, 138, 0.1) 30%, rgba(106, 74, 138, 0.2) 100%);
  border-radius: 50% 50% 0 0;
  animation: waveFlow 8s ease-in-out infinite;
}

.wave:nth-child(2) { animation-delay: 2s; opacity: 0.6; height: 80%; }
.wave:nth-child(3) { animation-delay: 4s; opacity: 0.4; height: 60%; }

@keyframes waveFlow {
  0%, 100% { transform: translateX(0) scaleY(1); }
  50% { transform: translateX(-5%) scaleY(1.1); }
}

.act--5 { background: radial-gradient(ellipse at center top, rgba(201, 169, 97, 0.2) 0%, rgba(201, 169, 97, 0.05) 40%, #000 100%); }
.act--5 .act__overlay { background: radial-gradient(ellipse at center, transparent 20%, rgba(0,0,0,0.6) 100%); }
.act--5 .poem__line--active .poem__primary {
  color: var(--gold-light);
  text-shadow: 0 0 40px rgba(201, 169, 97, 0.7), 0 0 80px rgba(201, 169, 97, 0.4);
}

.golden-ray {
  position: absolute;
  top: 0;
  left: 50%;
  width: 400px;
  height: 100vh;
  transform: translateX(-50%);
  background: radial-gradient(ellipse at top, rgba(201, 169, 97, 0.6) 0%, rgba(201, 169, 97, 0.2) 30%, transparent 70%);
  filter: blur(40px);
  z-index: 1;
  pointer-events: none;
  animation: rayPulse 4s ease-in-out infinite;
}

@keyframes rayPulse {
  0%, 100% { opacity: 0.6; transform: translateX(-50%) scaleX(1); }
  50% { opacity: 1; transform: translateX(-50%) scaleX(1.3); }
}

/* ============================================
   FINALE — Soul Seal
   ============================================ */
.finale {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3rem;
  padding: 4rem 2rem;
  background: radial-gradient(ellipse at center, #2A1F0A 0%, #000 70%);
  text-align: center;
}

.finale__title {
  font-family: var(--font-ar);
  font-size: clamp(1.8rem, 4vw, 3rem);
  font-weight: 400;
  color: var(--gold-light);
  text-shadow: 0 0 40px rgba(201, 169, 97, 0.6);
  animation: finalTitleGlow 4s ease-in-out infinite;
}

body[data-mode="englishPrimary"] .finale__title {
  font-family: var(--font-en);
  font-style: italic;
}

@keyframes finalTitleGlow {
  0%, 100% { text-shadow: 0 0 40px rgba(201, 169, 97, 0.6); }
  50% { text-shadow: 0 0 80px rgba(201, 169, 97, 0.9); }
}

.soul-seal {
  width: 100%;
  max-width: 700px;
  display: flex;
  flex-direction: column;
  gap: 2rem;
  opacity: 0;
  animation: fadeIn 2s 1s forwards;
}

@keyframes fadeIn { to { opacity: 1; } }

.soul-seal__prompt {
  font-family: var(--font-ar);
  font-size: clamp(1.1rem, 2vw, 1.5rem);
  color: rgba(232, 228, 220, 0.7);
  font-style: italic;
  line-height: 1.7;
}

body[data-mode="englishPrimary"] .soul-seal__prompt {
  font-family: var(--font-en);
}

.soul-seal__input-wrap {
  position: relative;
  width: 100%;
  padding: 1.5rem;
  background: rgba(10, 10, 15, 0.4);
  backdrop-filter: blur(24px);
  border: 1px solid rgba(201, 169, 97, 0.2);
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
}

.soul-seal__input {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: var(--bone);
  font-family: var(--font-ar);
  font-size: 1.1rem;
  line-height: 1.7;
  resize: none;
  min-height: 100px;
  text-align: right;
}

body[data-mode="englishPrimary"] .soul-seal__input {
  font-family: var(--font-en);
  font-style: italic;
  text-align: left;
}

.soul-seal__input::placeholder {
  color: rgba(232, 228, 220, 0.25);
}

.soul-seal__counter {
  position: absolute;
  bottom: 0.75rem;
  left: 1rem;
  font-family: var(--font-ui);
  font-size: 0.7rem;
  color: rgba(232, 228, 220, 0.3);
}

.soul-seal__btn {
  padding: 1rem 2.5rem;
  background: rgba(201, 169, 97, 0.1);
  border: 1px solid rgba(201, 169, 97, 0.4);
  border-radius: 8px;
  color: var(--gold);
  font-family: var(--font-ui);
  font-size: 0.9rem;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: all 0.4s var(--ease-cinematic);
  align-self: center;
}

.soul-seal__btn:hover {
  background: rgba(201, 169, 97, 0.2);
  border-color: var(--gold);
  box-shadow: 0 0 25px rgba(201, 169, 97, 0.4);
  transform: translateY(-2px);
}

.soul-seal__btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.soul-seal__confirmation {
  font-family: var(--font-ar);
  font-size: 1rem;
  color: var(--gold);
  opacity: 0;
  transition: opacity 1s;
}

.soul-seal__confirmation.visible { opacity: 1; }

/* Soul Wall */
.soul-wall {
  width: 100%;
  max-width: 900px;
  margin-top: 2rem;
  padding-top: 2rem;
  border-top: 1px solid rgba(201, 169, 97, 0.1);
}

.soul-wall__title {
  font-family: var(--font-ar);
  font-size: 1rem;
  color: rgba(232, 228, 220, 0.4);
  letter-spacing: 0.3em;
  margin-bottom: 1.5rem;
  font-weight: 400;
}

body[data-mode="englishPrimary"] .soul-wall__title {
  font-family: var(--font-ui);
  letter-spacing: 0.4em;
}

.soul-wall__grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1rem;
}

.soul-card {
  padding: 1.2rem;
  background: rgba(10, 10, 15, 0.4);
  backdrop-filter: blur(15px);
  border: 1px solid rgba(201, 169, 97, 0.1);
  border-radius: 12px;
  text-align: right;
  transition: all 0.4s;
  animation: soulCardIn 0.8s var(--ease-cinematic);
}

@keyframes soulCardIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.soul-card:hover {
  border-color: rgba(201, 169, 97, 0.3);
  transform: translateY(-3px);
}

.soul-card__text {
  font-family: var(--font-ar);
  font-size: 0.95rem;
  color: rgba(232, 228, 220, 0.85);
  line-height: 1.6;
  margin-bottom: 0.8rem;
  font-style: italic;
}

body[data-mode="englishPrimary"] .soul-card__text {
  font-family: var(--font-en);
}

.soul-card__date {
  font-family: var(--font-ui);
  font-size: 0.7rem;
  color: rgba(232, 228, 220, 0.3);
  letter-spacing: 0.1em;
}

/* Finale buttons */
.finale__actions {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  justify-content: center;
}

.finale__btn {
  padding: 0.8rem 1.8rem;
  background: transparent;
  border: 1px solid rgba(201, 169, 97, 0.3);
  border-radius: 8px;
  color: var(--gold);
  font-family: var(--font-ui);

/* ============================================
   AUDIO SYNC ENGINE
   ============================================ */
class AudioSyncEngine {
  constructor(audio) {
    this.audio = audio;
    this.currentAct = null;
    this.currentLineEl = null;
    this.lastAct = null;
    this.onActChange = null;
    this.onLineChange = null;
    
    this.audio.addEventListener('timeupdate', () => this.tick());
  }

  tick() {
    const t = this.audio.currentTime;
    
    // Find current act
    let currentActId = null;
    for (const [actId, range] of Object.entries(ACT_RANGES)) {
      if (t >= range.start && t < range.end) {
        currentActId = actId;
        break;
      }
    }
    
    // Handle act change
    if (currentActId && currentActId !== this.currentAct) {
      this.currentAct = currentActId;
      if (this.onActChange) this.onActChange(currentActId);
    }
    
    // Find current line within act
    if (currentActId && POEM_DATA[currentActId]) {
      const lines = POEM_DATA[currentActId];
      let activeIdx = -1;
      
      for (let i = 0; i < lines.length; i++) {
        if (t >= lines[i].start && t < lines[i].end) {
          activeIdx = i;
          break;
        }
      }
      
      if (activeIdx >= 0) {
        const el = document.querySelector(
          `.poem[data-poem="${currentActId}"] .poem__line[data-index="${activeIdx}"]`
        );
        if (el && el !== this.currentLineEl) {
          this.setActiveLine(el);
        }
      }
    }
    
    this.updateProgress();
    this.updateTimeDisplay();
  }

  setActiveLine(el) {
    if (this.currentLineEl) this.currentLineEl.classList.remove('poem__line--active');
    this.currentLineEl = el;
    el.classList.add('poem__line--active');
    
    // Auto-scroll to the act
    const act = el.closest('.act');
    if (act && !this.isScrollingManually()) {
      this.scrollToAct(act);
    }
  }

  isScrollingManually() {
    return Date.now() - (window._lastUserScroll || 0) < 3000;
  }

  scrollToAct(act) {
    if (!act) return;
    const rect = act.getBoundingClientRect();
    const isVisible = rect.top >= -100 && rect.bottom <= window.innerHeight + 100;
    
    if (!isVisible) {
      act.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  updateProgress() {
    const pct = (this.audio.currentTime / this.audio.duration) * 100 || 0;
    document.getElementById('progressBar').style.width = pct + '%';
  }

  updateTimeDisplay() {
    const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
    const display = document.getElementById('timeDisplay');
    if (display && this.audio.duration) {
      display.textContent = `${fmt(this.audio.currentTime)} / ${fmt(this.audio.duration)}`;
    }
  }
}

/* ============================================
   PARTICLE ENGINE
   ============================================ */
class ParticleField {
  constructor(canvas, opts = {}) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.color = opts.color || '201, 169, 97';
    this.count = opts.count || 60;
    this.speed = opts.speed || 0.3;
    this.size = opts.size || 2;
    this.direction = opts.direction || 'up';
    this.particles = [];
    this.resize();
    this.init();
    this.animate();
    window.addEventListener('resize', () => this.resize());
  }

  resize() {
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = this.canvas.offsetWidth * dpr;
    this.canvas.height = this.canvas.offsetHeight * dpr;
    this.ctx.scale(dpr, dpr);
    this.w = this.canvas.offsetWidth;
    this.h = this.canvas.offsetHeight;
  }

  init() {
    this.particles = [];
    for (let i = 0; i < this.count; i++) {
      this.particles.push({
        x: Math.random() * this.w,
        y: Math.random() * this.h,
        vx: (Math.random() - 0.5) * this.speed,
        vy: this.direction === 'up' ? -Math.random() * this.speed - 0.1 : Math.random() * this.speed + 0.1,
        size: Math.random() * this.size + 0.5,
        opacity: Math.random() * 0.5 + 0.1,
        twinkle: Math.random() * Math.PI * 2
      });
    }
  }

  animate() {
    this.ctx.clearRect(0, 0, this.w, this.h);
    this.particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.twinkle += 0.02;
      const opacity = p.opacity * (0.6 + Math.sin(p.twinkle) * 0.4);
      
      if (p.y < -10) p.y = this.h + 10;
      if (p.y > this.h + 10) p.y = -10;
      if (p.x < -10) p.x = this.w + 10;
      if (p.x > this.w + 10) p.x = -10;
      
      this.ctx.beginPath();
      this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      this.ctx.fillStyle = `rgba(${this.color}, ${opacity})`;
      this.ctx.shadowBlur = 10;
      this.ctx.shadowColor = `rgba(${this.color}, ${opacity})`;
      this.ctx.fill();
    });
    requestAnimationFrame(() => this.animate());
  }

  setColor(color) { this.color = color; }
}

class NeuralNetwork {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.resize();
    this.init();
    this.animate();
    window.addEventListener('resize', () => this.resize());
  }
  
  resize() {
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = this.canvas.offsetWidth * dpr;
    this.canvas.height = this.canvas.offsetHeight * dpr;
    this.ctx.scale(dpr, dpr);
    this.w = this.canvas.offsetWidth;
    this.h = this.canvas.offsetHeight;
    this.init();
  }
  
  init() {
    this.nodes = [];
    for (let i = 0; i < 25; i++) {
      this.nodes.push({
        x: Math.random() * this.w,
        y: Math.random() * this.h,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        r: Math.random() * 2 + 1,
        pulse: Math.random() * Math.PI * 2
      });
    }
  }
  
  animate() {
    this.ctx.clearRect(0, 0, this.w, this.h);
    
    this.nodes.forEach((n1, i) => {
      this.nodes.forEach((n2, j) => {
        if (i >= j) return;
        const dx = n1.x - n2.x;
        const dy = n1.y - n2.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 150) {
          this.ctx.beginPath();
          this.ctx.moveTo(n1.x, n1.y);
          this.ctx.lineTo(n2.x, n2.y);
          this.ctx.strokeStyle = `rgba(74, 144, 217, ${0.15 * (1 - dist/150)})`;
          this.ctx.lineWidth = 0.5;
          this.ctx.stroke();
        }
      });
    });
    
    this.nodes.forEach(n => {
      n.x += n.vx;
      n.y += n.vy;
      n.pulse += 0.03;
      if (n.x < 0 || n.x > this.w) n.vx *= -1;
      if (n.y < 0 || n.y > this.h) n.vy *= -1;
      
      const glow = 0.5 + Math.sin(n.pulse) * 0.5;
      
      this.ctx.beginPath();
      this.ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      this.ctx.fillStyle = `rgba(74, 144, 217, ${glow * 0.8})`;
      this.ctx.shadowBlur = 15;
      this.ctx.shadowColor = `rgba(74, 144, 217, ${glow})`;
      this.ctx.fill();
    });
    
    requestAnimationFrame(() => this.animate());
  }
}

/* ============================================
   SOUL SEAL
   ============================================ */
class SoulSeal {
  constructor() {
    this.storageKey = 'echoes_soul_seals';
    this.seals = JSON.parse(localStorage.getItem(this.storageKey) || '[]');
  }

  add(text) {
    if (!text.trim()) return null;
    const seal = {
      id: Date.now(),
      text: text.trim().slice(0, 280),
      timestamp: new Date().toISOString(),
      lang: document.documentElement.lang
    };
    this.seals.unshift(seal);
    if (this.seals.length > 50) this.seals.pop();
    localStorage.setItem(this.storageKey, JSON.stringify(this.seals));
    return seal;
  }

  renderWall() {
    const grid = document.getElementById('soulWallGrid');
    if (!grid) return;
    
    if (this.seals.length === 0) {
      grid.innerHTML = '<p style="color: rgba(232,228,220,0.3); font-family: var(--font-ar); font-size: 0.9rem;">لا توجد أختام بعد. كن أول من يختم روحه.</p>';
      return;
    }
    
    grid.innerHTML = this.seals.map(seal => `
      <div class="soul-card">
        <p class="soul-card__text">"${seal.text}"</p>
        <span class="soul-card__date">${new Date(seal.timestamp).toLocaleDateString(seal.lang === 'ar' ? 'ar-EG' : 'en-US')}</span>
      </div>
    `).join('');
  }
}

/* ============================================
   MODE SWITCHER
   ============================================ */
function setMode(mode) {
  document.body.dataset.mode = mode;
  document.documentElement.lang = mode === 'englishPrimary' || mode === 'englishOnly' ? 'en' : 'ar';
  document.documentElement.dir = mode === 'englishPrimary' || mode === 'englishOnly' ? 'ltr' : 'rtl';
  
  document.querySelectorAll('.mode-selector button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  
  localStorage.setItem('echoes_mode', mode);
}

/* ============================================
   CALIBRATION MODE
   ============================================ */
class Calibration {
  constructor(audio) {
    this.audio = audio;
    this.newTimings = {};
    this.editing = null;
  }

  open() {
    const modal = document.getElementById('calibrationModal');
    modal.classList.add('visible');
    this.render();
  }

  close() {
    document.getElementById('calibrationModal').classList.remove('visible');
  }

  render() {
    const list = document.getElementById('calibrationList');
    const timings = JSON.parse(localStorage.getItem('echoes_custom_timings') || '{}');
    
    let html = '';
    ACTS_ORDER.forEach(actId => {
      html += `<div style="margin-top: 1.5rem; color: var(--gold); font-family: var(--font-ui); font-size: 0.8rem; letter-spacing: 0.2em;">${actId.toUpperCase()}</div>`;
      
      POEM_DATA[actId].forEach((line, idx) => {
        const key = `${actId}-${idx}`;
        const start = timings[key] || line.start;
        html += `
          <div class="calibration-item">
            <span class="calibration-item__time">${this.formatTime(start)}</span>
            <span class="calibration-item__text">${line.ar.substring(0, 60)}...</span>
            <button class="calibration-item__set" data-act="${actId}" data-idx="${idx}">الآن</button>
          </div>
        `;
      });
    });
    
    list.innerHTML = html;
    
    list.querySelectorAll('.calibration-item__set').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = `${btn.dataset.act}-${btn.dataset.idx}`;
        const newStart = this.audio.currentTime;
        const timings = JSON.parse(localStorage.getItem('echoes_custom_timings') || '{}');
        timings[key] = newStart;
        localStorage.setItem('echoes_custom_timings', JSON.stringify(timings));
        
        // Update display
        btn.previousElementSibling.previousElementSibling.textContent = this.formatTime(newStart);
        
        // Update data
        POEM_DATA[btn.dataset.act][parseInt(btn.dataset.idx)].start = newStart;
      });
    });
  }

  formatTime(s) {
    return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  }
}

/* ============================================
   INIT
   ============================================ */
let audio, syncEngine, sealManager, calibration;
let particleFields = [];

document.addEventListener('DOMContentLoaded', () => {
  renderPoems();
  
  // Restore mode
  const savedMode = localStorage.getItem('echoes_mode') || 'arabicPrimary';
  setMode(savedMode);
  
  // Restore custom timings
  const customTimings = JSON.parse(localStorage.getItem('echoes_custom_timings') || '{}');
  Object.keys(customTimings).forEach(key => {
    const [actId, idx] = key.split('-');
    if (POEM_DATA[actId] && POEM_DATA[actId][idx]) {
      POEM_DATA[actId][parseInt(idx)].start = customTimings[key];
    }
  });
  
  // Audio
  audio = document.getElementById('bgMusic');
  syncEngine = new AudioSyncEngine(audio);
  sealManager = new SoulSeal();
  calibration = new Calibration(audio);
  
  // Portal
  const portal = document.getElementById('portal');
  document.getElementById('awakenBtn').addEventListener('click', () => {
    portal.classList.add('portal--awakening');
    
    setTimeout(() => {
      portal.style.display = 'none';
      document.getElementById('experience').classList.add('experience--visible');
      
      // Init particles
      initParticles();
      
      // Play audio
      audio.volume = 0.7;
      audio.play().catch(err => console.log('Autoplay blocked'));
      
      // Start sync
      audio.addEventListener('timeupdate', () => syncEngine.tick());
      
      // Render soul wall
      sealManager.renderWall();
    }, 2500);
  });
  
  // Play/pause
  document.getElementById('playBtn').addEventListener('click', (e) => {
    if (audio.paused) {
      audio.play();
      e.target.textContent = '⏸';
    } else {
      audio.pause();
      e.target.textContent = '▶';
    }
  });
  
  // Mode buttons
  document.querySelectorAll('.mode-selector button').forEach(btn => {
    btn.addEventListener('click', () => setMode(btn.dataset.mode));
  });
  
  // Calibration
  document.getElementById('calibrateBtn').addEventListener('click', () => calibration.open());
  document.getElementById('calibClose').addEventListener('click', () => calibration.close());
  
  // Restart
  document.getElementById('restartBtn').addEventListener('click', () => location.reload());
  
  // Soul Seal input
  const soulInput = document.getElementById('soulInput');
  const soulBtn = document.getElementById('sealBtn');
  const soulCounter = document.getElementById('soulCounter');
  
  soulInput.addEventListener('input', () => {
    soulCounter.textContent = `${soulInput.value.length} / 280`;
    soulBtn.disabled = soulInput.value.trim().length < 3;
  });
  
  soulBtn.addEventListener('click', () => {
    const text = soulInput.value.trim();
    if (!text) return;
    
    sealManager.add(text);
    soulInput.value = '';
    soulCounter.textContent = '0 / 280';
    soulBtn.disabled = true;
    
    const confirmation = document.getElementById('sealConfirmation');
    confirmation.classList.add('visible');
    setTimeout(() => confirmation.classList.remove('visible'), 4000);
    
    sealManager.renderWall();
    
    // Reset audio to finale
    setTimeout(() => {
      document.getElementById('finale').scrollIntoView({ behavior: 'smooth' });
    }, 100);
  });
  
  // Track manual scroll (for sync engine)
  window.addEventListener('scroll', () => { window._lastUserScroll = Date.now(); });
});

function initParticles() {
  const configs = [
    { id: 'canvas-act1', color: '180, 180, 200', count: 80, speed: 0.4, direction: 'down' },
    { id: 'canvas-act2', color: '200, 100, 120', count: 50, speed: 0.3 },
    { id: 'canvas-bridge1', color: '201, 169, 97', count: 100, speed: 0.5 },
    { id: 'canvas-act3', color: '170, 90, 106', count: 40, speed: 0.25 },
    { id: 'canvas-bridge2', color: '154, 122, 186', count: 70, speed: 0.4 },
    { id: 'canvas-act5', color: '232, 213, 160', count: 150, speed: 0.6 }
  ];
  
  configs.forEach(cfg => {
    const el = document.getElementById(cfg.id);
    if (el) particleFields.push(new ParticleField(el, cfg));
  });
  
  const neural = document.getElementById('canvas-act4');
  if (neural) new NeuralNetwork(neural);
}

// Update particle colors on act change
syncEngine_actChangeHook = (actId) => {
  const colorMap = {
    act1: '180, 180, 200',
    act2: '200, 100, 120',
    bridge1: '201, 169, 97',
    act4: '74, 144, 217',
    act3: '170, 90, 106',
    bridge2: '154, 122, 186',
    act5: '232, 213, 160'
  };
  if (colorMap[actId]) {
    particleFields.forEach(pf => pf.setColor(colorMap[actId]));
  }
};

// Attach hook
const origTick = syncEngine?.tick;
if (syncEngine) {
  const originalOnAct = syncEngine.onActChange;
  syncEngine.onActChange = (actId) => {
    if (originalOnAct) originalOnAct(actId);
    syncEngine_actChangeHook(actId);
  };
}

function shareQuote() {
  const currentActive = document.querySelector('.poem__line--active');
  let text = '"وحينها... تذكّرت الروح" — أصداء المطلق';
  
  if (currentActive) {
    const primary = currentActive.querySelector('.poem__primary')?.textContent || '';
    const secondary = currentActive.querySelector('.poem__secondary')?.textContent || '';
    text = `"${primary}"\n\n"${secondary}"\n\n— Echoes of the Absolute`;
  }
  
  if (navigator.share) {
    navigator.share({ title: 'أصداء المطلق', text });
  } else {
    navigator.clipboard.writeText(text);
    alert('✨ تم نسخ الاقتباس');
  }
}
